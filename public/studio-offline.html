<!doctype html>
<!--
  Halaman offline Studio (E10). Disajikan service worker (/studio-sw.js) saat navigasi Studio gagal.
  Mandiri: tanpa skrip Next dan tanpa data, supaya tetap jalan setelah deploy baru. Ide disimpan ke IndexedDB
  (nama/versi/store sama dengan src/features/pwa/offline-queue.ts, dicek test) lalu dikirim lewat
  createQuickIdea oleh Studio saat online lagi.
-->
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0B0B0C" />
    <link rel="manifest" href="/studio.webmanifest" />
    <link rel="icon" href="/studio-icons/icon-192.png" />
    <title>Studio offline</title>
    <style>
      /* Nilai default tema (preset Monokrom, src/lib/theme/defaults.ts). Halaman ini statis dan tidak
         membaca database (T14), jadi tema kustom tidak berlaku di sini. */
      :root {
        color-scheme: light dark;
        --bg: #F5F5F3;
        --card: #FFFFFF;
        --fg: #0A0A0A;
        --muted: #6B6B6B;
        --heading-muted: #8A8A8A;
        --border: #E4E4E1;
        --secondary: #ECECEA;
        --primary: #0A0A0A;
        --primary-fg: #FFFFFF;
        --ring: #6E4FD8;
        --warning: #93370D;
        --destructive: #A8221A;
        --radius-card: 28px;
        --radius-nested: 20px;
        --radius-input: 14px;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0B0B0C;
          --card: #161618;
          --fg: #F5F5F3;
          --muted: #9A9A9F;
          --heading-muted: #6E6E73;
          --border: #2A2A2E;
          --secondary: #242427;
          --primary: #F5F5F3;
          --primary-fg: #0A0A0A;
          --ring: #9B83F0;
          --warning: #FDB022;
          --destructive: #FF7A70;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; background: var(--bg); color: var(--fg); line-height: 1.5; -webkit-font-smoothing: antialiased; }
      main { max-width: 34rem; margin: 0 auto; padding: max(1.5rem, env(safe-area-inset-top)) 1rem 2rem; }
      .label { font-size: 0.6875rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 0.5rem; margin: 0 0 1rem; }
      .label::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--fg); }
      h1 { font-family: "Inter Tight", Inter, system-ui, sans-serif; font-size: clamp(2rem, 1.5rem + 2.5vw, 2.75rem); font-weight: 500; line-height: 1.02; letter-spacing: -0.035em; margin: 0 0 0.75rem; }
      h1 span { display: block; color: var(--heading-muted); }
      p { margin: 0 0 0.75rem; color: var(--muted); font-size: 0.9375rem; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 1.25rem; margin-top: 1rem; }
      label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.4rem; }
      input[type="text"] { width: 100%; font: inherit; font-size: 1rem; height: 2.75rem; padding: 0 0.875rem; border-radius: var(--radius-input); border: 1px solid var(--border); background: var(--card); color: var(--fg); }
      input[type="text"]:focus-visible { outline: 3px solid color-mix(in srgb, var(--ring) 50%, transparent); border-color: var(--ring); }
      fieldset { border: 0; padding: 0; margin: 1rem 0 0; }
      legend { font-size: 0.875rem; font-weight: 600; margin-bottom: 0.4rem; padding: 0; }
      .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .chips label { margin: 0; }
      .chips input { position: absolute; opacity: 0; pointer-events: none; }
      .chips span { display: inline-flex; align-items: center; min-height: 2.25rem; background: var(--secondary); border-radius: 999px; padding: 0 0.9rem; font-size: 0.875rem; font-weight: 500; cursor: pointer; }
      .chips input:checked + span { background: var(--primary); color: var(--primary-fg); }
      .chips input:focus-visible + span { outline: 2px solid var(--ring); outline-offset: 2px; }
      button { font: inherit; font-weight: 500; min-height: 2.5rem; border-radius: 999px; padding: 0 1.1rem; cursor: pointer; border: 0; background: var(--secondary); color: var(--fg); }
      button:focus-visible { outline: 3px solid color-mix(in srgb, var(--ring) 50%, transparent); outline-offset: 2px; }
      button.primary { background: var(--primary); color: var(--primary-fg); width: 100%; min-height: 2.75rem; margin-top: 1.25rem; }
      .error { color: var(--destructive); font-size: 0.8125rem; margin: 0.4rem 0 0; min-height: 1em; }
      .badge { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.875rem; font-weight: 600; color: var(--warning); }
      ul { margin: 0.5rem 0 0; padding-left: 1.1rem; font-size: 0.9375rem; overflow-wrap: anywhere; }
      .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: space-between; }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Studio · Offline</p>
      <h1>Studio sedang offline<span>idemu tetap aman</span></h1>
      <p>Halaman Studio butuh koneksi ke server. Ide tetap bisa dicatat di sini: tersimpan di perangkat ini dan masuk Bank Ide saat Studio dibuka lagi dengan koneksi.</p>

      <form id="idea-form" class="card" novalidate>
        <label for="title">Ide baru</label>
        <input id="title" name="title" type="text" maxlength="200" autocomplete="off" placeholder="mis. Time-lapse gambar tangan hari ke-30" required />
        <p id="title-error" class="error" role="alert"></p>
        <fieldset>
          <legend>Medium (opsional)</legend>
          <div class="chips">
            <label><input type="radio" name="medium" value="DRAWING" /><span>Gambar</span></label>
            <label><input type="radio" name="medium" value="CLAY" /><span>Clay</span></label>
            <label><input type="radio" name="medium" value="MIXED" /><span>Campuran</span></label>
          </div>
        </fieldset>
        <button type="submit" class="primary">Simpan ide di perangkat</button>
      </form>

      <section class="card" aria-live="polite">
        <div class="row">
          <span id="queue-count" class="badge">Belum ada ide yang menunggu sinkron.</span>
          <button id="retry" type="button">Coba buka Studio</button>
        </div>
        <ul id="queue-list"></ul>
      </section>
    </main>

    <script>
      (function () {
        // Harus sama dengan OFFLINE_IDEA_DB di src/features/pwa/offline-queue.ts.
        var DB_NAME = "studio-offline";
        var DB_VERSION = 1;
        var STORE = "ideas";
        var TITLE_MAX = 200;
        var MEDIUMS = ["DRAWING", "CLAY", "MIXED"];

        function openDb() {
          return new Promise(function (resolve, reject) {
            var request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onupgradeneeded = function () {
              var db = request.result;
              if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: "id" });
            };
            request.onsuccess = function () { resolve(request.result); };
            request.onerror = function () { reject(request.error); };
          });
        }

        function tx(mode, run) {
          return openDb().then(function (db) {
            return new Promise(function (resolve, reject) {
              var t = db.transaction(STORE, mode);
              var result = run(t.objectStore(STORE));
              t.oncomplete = function () { db.close(); resolve(result && "result" in result ? result.result : undefined); };
              t.onerror = function () { db.close(); reject(t.error); };
            });
          });
        }

        function newId() {
          if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
          return "off-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
        }

        var countEl = document.getElementById("queue-count");
        var listEl = document.getElementById("queue-list");
        var form = document.getElementById("idea-form");
        var titleEl = document.getElementById("title");
        var errorEl = document.getElementById("title-error");

        function render() {
          return tx("readonly", function (store) { return store.getAll(); }).then(function (items) {
            items = (items || []).sort(function (a, b) { return a.createdAt - b.createdAt; });
            countEl.textContent = items.length
              ? items.length + " ide menunggu sinkron"
              : "Belum ada ide yang menunggu sinkron.";
            listEl.textContent = "";
            items.forEach(function (item) {
              var li = document.createElement("li");
              li.textContent = item.title;
              listEl.appendChild(li);
            });
          }).catch(function () {
            countEl.textContent = "Penyimpanan perangkat tidak tersedia di browser ini.";
          });
        }

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          var title = titleEl.value.trim();
          if (!title) { errorEl.textContent = "Judul wajib diisi"; titleEl.focus(); return; }
          if (title.length > TITLE_MAX) { errorEl.textContent = "Judul maksimal 200 karakter"; return; }
          errorEl.textContent = "";
          var checked = form.querySelector('input[name="medium"]:checked');
          var medium = checked && MEDIUMS.indexOf(checked.value) >= 0 ? checked.value : null;
          var item = { id: newId(), title: title, medium: medium, createdAt: Date.now() };
          tx("readwrite", function (store) { store.add(item); }).then(function () {
            form.reset();
            titleEl.focus();
            return render();
          }).catch(function () {
            errorEl.textContent = "Gagal menyimpan di perangkat. Coba lagi.";
          });
        });

        document.getElementById("retry").addEventListener("click", function () { window.location.href = "/studio"; });
        // Kembali online: buka Studio (yang mengirim antrean ke Bank Ide), kecuali sedang mengetik ide yang belum
        // disimpan; ide itu dikirim setelah disimpan.
        function openStudioIfIdle() {
          if (titleEl.value.trim()) {
            countEl.textContent = "Online lagi. Simpan ide ini, lalu ketuk Coba buka Studio untuk mengirim antrean.";
            return;
          }
          window.location.replace("/studio");
        }
        window.addEventListener("online", openStudioIfIdle);
        render();
      })();
    </script>
  </body>
</html>
